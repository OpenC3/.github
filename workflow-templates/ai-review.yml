# Adversarial AI review: once CI has finished, each pull request is scanned for
# obfuscated code, prompt injection and other malicious changes, and if the scan
# passes, Claude and Codex take turns reviewing it, fixing CI failures and other
# issues, until one approves without changes.
# Copy this file to .github/workflows/ in the repo and:
# 1. List every workflow that runs on pull_request under `workflows:` below. The review
#    starts when one of them completes and all CI is done, so a missing one that finishes
#    last means no review. Each run warns about any that are missing.
# 2. Replace $default-branch under `branches-ignore:` with your default branch name.
#    GitHub substitutes it only when you start the workflow from the Actions tab; the
#    literal matches no branch, which only adds skipped runs for pushes.
# 3. Add ANTHROPIC_API_KEY and OPENAI_API_KEY to the repo (or org) secrets, and
#    AI_REVIEW_PUSH_TOKEN so the reviewers' fixes are published: a GitHub App token (or
#    fine-grained PAT) with contents:write, pull-requests:write and no workflows permission,
#    so GitHub refuses a push that changes a workflow. The fixes come as a PR into the
#    reviewed PR's branch; set fix_mode: push to commit them straight onto that branch.
# 4. Optionally describe what to look for in review_instructions.
# 5. If the repo uses SonarQube Cloud, the reviewers also fix the PR's SonarQube findings. A
#    private project needs SONAR_TOKEN in the secrets (a token that can browse the project).
# 6. Create a `malicious-scan-override` label. When the scan blocks a PR, the review does not
#    run and the PR's AI review comment says why (the findings are in the run's summary). A
#    maintainer with write access who has checked them adds the label, then runs this workflow
#    by hand for the PR. A new push is scanned again.
#
# Add the `skip-ai-review` label to a PR to opt out. Changes to this file take effect once
# they are on the default branch.
#
# To review a PR by hand, run this workflow from the Actions tab with the PR number. The run fails
# with the reason if it cannot review.

name: AI Review

on:
  workflow_run:
    workflows:
      - CI  # Update this
    types:
      - completed
    branches-ignore:
      - $default-branch
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
      force:
        description: Review even if this commit was already reviewed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review:
    uses: OpenC3/.github/.github/workflows/ai-review-reusable.yml@main
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    with:
      pr_number: ${{ inputs.pr_number }}
      force: ${{ inputs.force || false }}
      # review_instructions: |  # Uncomment to add repository-specific guidance for the reviewers
      #   - Check that ...
      # max_turns: "6"  # Uncomment and update if needed
      # fix_mode: push  # Uncomment to commit fixes onto the PR's branch instead of opening a fix PR
      # claude_model: claude-opus-5-5  # Uncomment and update if needed (used by the scan too)
      # scan_project_description: "OpenC3 COSMOS plugin for ..."  # Uncomment to describe the repo to the scan
      # Uncomment if the repo commits build output (e.g. a site published from docs/). Minified
      # files are always handled; list only files nothing runs in CI, since a PR chooses its paths.
      # scan_generated_paths: |
      #   docs/**/*.html
      #   docs/assets/**
      # sonar_project_key: Org_repo  # Uncomment if the SonarQube check run does not link the project
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEW_PUSH_TOKEN: ${{ secrets.AI_REVIEW_PUSH_TOKEN }}
      # SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Uncomment for a private SonarQube project
