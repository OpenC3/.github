# Example workflow for non-tool (no pnpm) plugins
# Copy this file to .github/workflows/ in the plugin repo and:
# 1. Update the workflow name if necessary (if you're in cosmos-enterprise-plugins and have multiple release workflows)
# 2. Update the workflow filename if necessary
# 3. Update plugin_directory argument. This should be "." for single repos, and e.g. "openc3-cosmos-orbitview" for cosmos-enterprise-plugins.
# 4. Add the OpenC3 admin accont API token to the repo secrets as OPENC3_API_TOKEN
# 5. To publish to RubyGems, add your RubyGems API key to the repo secrets as
#    RUBYGEMS_API_KEY and check 'Publish the gem to RubyGems' when you run this

name: Release COSMOS Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        type: string
      deploy_to_store:
        description: 'Deploy to OpenC3 App Store'
        required: false
        type: boolean
        default: true
      deploy_to_rubygems:
        description: 'Publish the gem to RubyGems'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: OpenC3/.github/.github/workflows/release-cosmos-plugin-reusable.yml@main
    with:
      version: ${{ inputs.version }}
      deploy_to_store: ${{ inputs.deploy_to_store }}
      deploy_to_rubygems: ${{ inputs.deploy_to_rubygems }}
      plugin_directory: openc3-cosmos-foo-plugin  # Update this
    secrets:
      OPENC3_API_TOKEN: ${{ secrets.OPENC3_API_TOKEN }}
      RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
